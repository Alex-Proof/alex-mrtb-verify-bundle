name: release

# Baut bei jedem Versions-Tag (v*.*.*) das signierte, SLSA-attestierte, unabhaengig
# reproduzierbare Source-Tarball UND die eigenstaendigen SEA-Binaries fuer Windows/macOS/Linux
# (siehe README "Prebuilt binaries"). Die Binaries sind bewusst unsigniert -- Checksumme gegen
# den eigenen Build aus demselben Tag nachrechnen (npm ci && npm run build:sea), statt der
# Binary blind zu vertrauen. Das Tarball ist weiterhin die primaere Vertrauensquelle.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-sea:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: alex-verify-linux-x64
          - os: macos-latest
            artifact: alex-verify-macos-arm64
          - os: windows-latest
            artifact: alex-verify-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.2"
      - run: npm ci
      - run: npm run build --silent
      - run: node scripts/build-sea.mjs ${{ matrix.artifact }}
      - name: sha256sum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi
          cat "${{ matrix.artifact }}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          retention-days: 7

  release:
    needs: build-sea
    runs-on: ubuntu-latest
    outputs:
      asset_name: ${{ steps.package.outputs.asset_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Require a signed tag
        run: |
          set -euo pipefail
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "${GITHUB_WORKSPACE}/.github/allowed_signers"
          git verify-tag "${GITHUB_REF_NAME}"

      # This is a snapshot, not a history: it captures the protection rules as the
      # GitHub API reports them AT BUILD TIME, not what they were while the commits
      # being released were authored. A release built in a window where protection
      # was briefly off looks, for every OTHER field on this bundle, identical to one
      # built under full protection -- this step does not close that gap, it only
      # stops hiding it. See TRUST-BOUNDARY.md for what this snapshot does and does
      # not prove.
      - name: Capture repository branch-protection state (build-time snapshot)
        id: protection_snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          tag="${GITHUB_REF_NAME}"
          name="alex-mrtb-verify-bundle-${tag}"
          snapshot_file="${name}.protection-snapshot.json"
          captured_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          protection="$(gh api "repos/${repo}/branches/main/protection")"
          jq -n \
            --arg schema "alex-mrtb-verify-bundle/protection-snapshot@1" \
            --arg captured_at "$captured_at" \
            --arg repository "$repo" \
            --arg branch "main" \
            --arg tag "$tag" \
            --arg commit_sha "${{ github.sha }}" \
            --argjson protection "$protection" \
            '{
              schema: $schema,
              captured_at: $captured_at,
              repository: $repository,
              branch: $branch,
              tag: $tag,
              commit_sha: $commit_sha,
              enforce_admins: $protection.enforce_admins.enabled,
              required_signatures_enabled: $protection.required_signatures.enabled,
              required_status_checks_strict: $protection.required_status_checks.strict,
              required_status_checks_contexts: $protection.required_status_checks.contexts,
              required_pull_request_reviews_required_approving_review_count:
                ($protection.required_pull_request_reviews.required_approving_review_count // 0)
            }' > "$snapshot_file"
          cat "$snapshot_file"
          echo "SNAPSHOT_NAME=${snapshot_file}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-binaries
          merge-multiple: true

      - name: dist-binaries SHA256SUMS.txt
        run: cat dist-binaries/*.sha256 > dist-binaries/SHA256SUMS.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.2"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.16"
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Package release tarball (deterministic)
        id: package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          name="alex-mrtb-verify-bundle-${tag}"
          # SOURCE_DATE_EPOCH pinned to the tagged commit's own commit time, so an
          # independent rebuild of the same commit (see the "reproduce" job below,
          # or anyone rebuilding locally) derives the identical value without
          # needing it passed in -- not "now", which would differ between runs.
          epoch="$(git log -1 --format=%ct)"
          workdir="/tmp/${name}"
          rm -rf "$workdir"
          mkdir -p "$workdir"
          cp -r dist verify.ts verify.py spec trust-anchor.json README.md LICENSE package.json "$workdir/"
          find "$workdir" -print0 | xargs -0 touch -d "@${epoch}"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${epoch}" \
              -cf - -C /tmp "${name}" | gzip -n -9 > "${name}.tar.gz"
          sha256sum "${name}.tar.gz" "${SNAPSHOT_NAME}" > SHA256SUMS
          echo "ASSET_NAME=${name}.tar.gz" >> "$GITHUB_ENV"
          echo "asset_name=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign release tarball (keyless, GitHub OIDC -> public Rekor log)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature "${ASSET_NAME}.sig" \
            --output-certificate "${ASSET_NAME}.pem" \
            "${ASSET_NAME}"

      # Same cosign OIDC flow as the tarball above, its own signature -- the
      # snapshot is not folded into the tarball's signature, so it can be
      # verified (or found missing) on its own.
      - name: Sign protection snapshot (keyless, GitHub OIDC -> public Rekor log)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature "${SNAPSHOT_NAME}.sig" \
            --output-certificate "${SNAPSHOT_NAME}.pem" \
            "${SNAPSHOT_NAME}"

      - name: SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.ASSET_NAME }}
            ${{ env.SNAPSHOT_NAME }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ${{ env.ASSET_NAME }}
            ${{ env.ASSET_NAME }}.sig
            ${{ env.ASSET_NAME }}.pem
            ${{ env.SNAPSHOT_NAME }}
            ${{ env.SNAPSHOT_NAME }}.sig
            ${{ env.SNAPSHOT_NAME }}.pem
            SHA256SUMS
            dist-binaries/alex-verify-linux-x64
            dist-binaries/alex-verify-macos-arm64
            dist-binaries/alex-verify-windows-x64.exe
            dist-binaries/SHA256SUMS.txt
          generate_release_notes: true

      - name: Upload tarball for the independent rebuild-and-compare job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarball
          path: ${{ env.ASSET_NAME }}
          retention-days: 1

  reproduce:
    name: Independently rebuild the tag and byte-compare against the published tarball
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.2"
      - run: npm ci
      - run: npm run build

      - name: Rebuild the same tarball from source, independently of the release job
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          name="alex-mrtb-verify-bundle-${tag}"
          epoch="$(git log -1 --format=%ct)"
          workdir="/tmp/${name}"
          rm -rf "$workdir"
          mkdir -p "$workdir"
          cp -r dist verify.ts verify.py spec trust-anchor.json README.md LICENSE package.json "$workdir/"
          find "$workdir" -print0 | xargs -0 touch -d "@${epoch}"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${epoch}" \
              -cf - -C /tmp "${name}" | gzip -n -9 > "${name}.tar.gz"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: published

      - name: Byte-compare the independent rebuild against the published, signed tarball
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          name="alex-mrtb-verify-bundle-${tag}"
          rebuilt_hash="$(sha256sum "${name}.tar.gz" | cut -d' ' -f1)"
          published_hash="$(sha256sum "published/${name}.tar.gz" | cut -d' ' -f1)"
          echo "rebuilt:   ${rebuilt_hash}"
          echo "published: ${published_hash}"
          if [ "$rebuilt_hash" != "$published_hash" ]; then
            echo "::error::Independent rebuild does NOT match the published, signed release tarball. The release asset is not reproducible from this source commit." >&2
            exit 1
          fi
          echo "Independent rebuild is byte-identical to the published release tarball."
