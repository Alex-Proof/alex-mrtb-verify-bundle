name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Package release tarball
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          name="alex-mrtb-verify-bundle-${tag}"
          mkdir -p "/tmp/${name}"
          cp -r dist verify.ts verify.py spec trust-anchor.json README.md LICENSE package.json "/tmp/${name}/"
          tar -czf "${name}.tar.gz" -C /tmp "${name}"
          sha256sum "${name}.tar.gz" > SHA256SUMS
          echo "ASSET_NAME=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign release tarball (keyless, GitHub OIDC -> public Rekor log)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature "${ASSET_NAME}.sig" \
            --output-certificate "${ASSET_NAME}.pem" \
            "${ASSET_NAME}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ${{ env.ASSET_NAME }}
            ${{ env.ASSET_NAME }}.sig
            ${{ env.ASSET_NAME }}.pem
            SHA256SUMS
          generate_release_notes: true
